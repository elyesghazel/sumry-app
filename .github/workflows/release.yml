name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          version="${TAG#v}"
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          if ! [[ "$major$minor$patch" =~ ^[0-9]+$ ]]; then
            echo "tag $TAG is not v<major>.<minor>.<patch>[-suffix]" >&2
            exit 1
          fi
          # Android needs a growing integer; 2.1.0 -> 2001000. Never below 1.
          code=$(( major * 1000000 + minor * 1000 + patch ))
          (( code < 1 )) && code=1
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx expo prebuild --platform android --no-install

      - name: Set version, turn off OTA updates
        run: |
          sed -i -E \
            -e "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.code }}/" \
            -e "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" \
            android/app/build.gradle
          # The APK carries its own bundle; it must not pull updates from the maintainer's Expo project.
          sed -i -E \
            '/expo.modules.updates.ENABLED/s/android:value="true"/android:value="false"/' \
            android/app/src/main/AndroidManifest.xml
          grep -E 'versionCode|versionName' android/app/build.gradle
          grep 'expo.modules.updates.ENABLED' android/app/src/main/AndroidManifest.xml || true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify signature
        run: |
          apk="sumry-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee verify.txt
          if grep -q 'CN=Android Debug' verify.txt; then
            echo "APK is signed with the debug key" >&2
            exit 1
          fi
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            flags=(--verify-tag --generate-notes --title "$TAG")
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)
            gh release create "$TAG" "$APK" "${flags[@]}"
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
